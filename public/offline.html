<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1512" />
    <title>Sem conexão | Joias Gheller</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f6f0ea;
        color: #1c1512;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      p.brand {
        margin: 0 0 1.5rem;
        font-family: system-ui, sans-serif;
        font-size: 2.4rem;
        font-weight: 500;
        letter-spacing: -0.04em;
        text-transform: lowercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.2rem);
        font-style: italic;
        font-weight: 500;
        line-height: 1.1;
      }
      p.copy {
        max-width: 22rem;
        margin: 1rem auto 0;
        font-family: system-ui, sans-serif;
        color: #8a7468;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        background: #1c1512;
        color: #f6f0ea;
        font-family: system-ui, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">gheller</p>
      <h1>Você está offline.</h1>
      <p class="copy">Reconecte à internet para ver o catálogo e falar com a loja no WhatsApp.</p>
      <a href="/">Tentar de novo</a>
    </main>
  </body>
</html>
